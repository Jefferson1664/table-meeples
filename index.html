<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3efe7">
<link rel="manifest" href="./manifest.webmanifest">
<title>Table Meeples V6.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee9df;color:#292722;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:10;background:#f8f5ef;border-bottom:1px solid #d8d1c5;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
.title{font-size:22px;font-weight:800}.v{font-size:11px;font-weight:800;background:#2f2d29;color:#fff;padding:4px 7px;border-radius:7px}
.sub{font-size:12px;color:#746f66;margin-top:2px}.bar{display:flex;gap:7px;margin-top:9px;overflow:auto}
button,select,input{font:inherit}.btn,select{background:#fff;border:1px solid #d1c9bc;border-radius:10px;padding:9px 11px}
.btn{font-weight:700;white-space:nowrap}.primary{background:#2f2d29!important;color:#fff!important;border-color:#2f2d29!important}
main{padding:10px;display:grid;gap:10px}.panel{background:#f8f5ef;border:1px solid #d8d1c5;border-radius:14px;overflow:hidden}
.panel h2{font-size:14px;margin:0;padding:10px 12px;border-bottom:1px solid #ded8ce}
.reserve{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:9px}
.card{background:#fff;border:1px solid #d7d0c4;border-radius:12px;padding:8px;display:flex;align-items:center;gap:8px;min-height:68px}
.iconTap{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:0 0 48px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.piece{display:flex;align-items:center;justify-content:center;width:42px;height:42px}
.meeple{width:28px;height:35px;clip-path:polygon(30% 0,70% 0,78% 15%,100% 28%,84% 43%,75% 38%,78% 100%,55% 100%,50% 64%,45% 100%,22% 100%,25% 38%,16% 43%,0 28%,22% 15%)}
.circle{width:34px;height:34px;border-radius:50%;border:3px solid #aaa;box-shadow:inset 0 0 0 2px #fff8}
.bread{width:38px;height:25px;border-radius:48% 48% 44% 44%;transform:rotate(-8deg);border:2px solid #a77940}
.cube{width:31px;height:31px;border-radius:6px;transform:rotate(45deg)}
.star{font-size:36px;line-height:1;color:inherit}.heart{font-size:34px;line-height:1;color:inherit}.crown{font-size:34px;line-height:1;color:inherit}
.gem{width:29px;height:35px;clip-path:polygon(25% 0,75% 0,100% 38%,50% 100%,0 38%)}
.shield{width:31px;height:36px;clip-path:polygon(8% 0,92% 0,92% 62%,50% 100%,8% 62%)}
.coin{width:35px;height:35px;border-radius:50%;border:3px solid #9b741e;box-shadow:inset 0 0 0 2px #fff8}
.info{min-width:0}.name{font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qty{font-size:12px;color:#777;margin-top:2px}
.zones{display:grid;gap:9px;padding:9px}.zone{background:#fffdf9;border:1px solid #d6cfc3;border-radius:12px;min-height:130px;overflow:hidden}
.zoneHead{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px dashed #d8d1c5;background:#f5f1e8}
.zoneTitle{font-weight:800;font-size:13px}.zoneBtns{display:flex;gap:5px}.small{padding:5px 8px;border-radius:8px;background:#fff;border:1px solid #d2cabf;font-size:12px}
.groups{padding:10px;display:flex;flex-wrap:wrap;gap:14px 18px}.group{display:flex;flex-direction:column;align-items:center;gap:4px}
.pieces{display:flex;flex-wrap:wrap;max-width:190px;gap:4px}.pieces .iconTap{width:38px;height:42px;flex-basis:38px}.pieces .piece{width:36px;height:40px}
.groupCount{font-size:11px;color:#6f6a61;font-weight:700;text-align:center}.empty{padding:25px 12px;text-align:center;color:#999;font-size:12px}
.emptyBig{padding:40px 18px;text-align:center;color:#777}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:50}.modal.show{display:flex}
.sheet{background:#f8f5ef;width:100%;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px}.field{width:100%;padding:10px;border:1px solid #d2cabf;border-radius:10px;background:#fff;margin-bottom:9px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.choice{background:#fff;border:1px solid #d2cabf;border-radius:10px;padding:9px 5px;text-align:center}.choice.selected{outline:3px solid #2f2d29}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:8px 0 12px}.sw{height:36px;border-radius:9px;border:2px solid transparent}.sw.selected{border-color:#222;box-shadow:0 0 0 2px #fff inset}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.hint{font-size:12px;color:#716b62;margin:5px 0 10px}
.menuList{display:grid;gap:8px}.menuList .btn{text-align:left}.managerRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ddd}
.danger{color:#a52b2b;border-color:#d9b1b1}.footer{text-align:center;color:#777;font-size:11px;padding:2px 4px 15px}
@media(min-width:700px){main{grid-template-columns:1fr 1.4fr}.panel:first-child{grid-column:1}.panel:nth-child(2){grid-column:2;grid-row:1/3}}

.counter{background:#fff;border:1px solid #d7d0c4;border-radius:12px;padding:10px;margin:9px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.counterInfo{min-width:0}.counterName{font-weight:800;font-size:14px}.counterValue{font-size:25px;font-weight:900;min-width:55px;text-align:center}
.counterBtns{display:flex;gap:6px}.counterBtns button{width:42px;height:38px;border-radius:10px;border:1px solid #d1c9bc;background:#f8f5ef;font-size:21px;font-weight:800}
.counterBtns .reset{width:auto;font-size:12px;padding:0 8px}
.managerSection{margin-top:10px}.managerTitle{font-weight:800;font-size:13px;margin:12px 0 6px}
.cardDraw{display:grid;gap:12px}
.cardDrawGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.cardDrawPane{background:#fff;border:1px solid #d1c9bc;border-radius:12px;padding:8px;min-width:0}
.cardDrawPane img{width:100%;max-height:62vh;object-fit:contain;display:block;margin:auto;border-radius:7px}
.cardDrawTranslation{font-size:14px;line-height:1.42;text-align:left;white-space:pre-line;max-height:62vh;overflow:auto}
.cardDrawTranslation h4{margin:2px 0 10px;font-size:16px}
.cardDrawTranslation .cardTitleFr{font-weight:800;font-size:18px;margin-bottom:4px}
.cardDrawTranslation .cardTypeFr{font-size:12px;color:#716b62;font-weight:700;margin-bottom:12px}
.cardDrawMeta{font-size:12px;color:#716b62;text-align:center}
@media(max-width:700px){.cardDrawGrid{grid-template-columns:1fr}.cardDrawTranslation{max-height:none}}


.chaosGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:9px}.chaosTile{background:#fff;border:1px solid #d7d0c4;border-radius:12px;padding:7px 5px;text-align:center;position:relative;min-height:76px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.chaosTile:active{transform:scale(.98)}.chaosIcon{width:50px;height:50px;margin:0 auto 3px;display:block;border-radius:50%;background-repeat:no-repeat;background-color:#eee;box-shadow:0 1px 3px #0002}.realToken{width:50px;height:50px;border-radius:50%;background-repeat:no-repeat;background-color:#eee;box-shadow:0 1px 3px #0002}.realToken.base{background-image:url("https://cdn1.philibertnet.com/845647/arkham-horror-the-card-game-chaos-tokens-and-token-bag-4251715421345.jpg");background-size:400% 400%}.base-p1{background-position:100% 33.333%}.base-0{background-position:100% 0%}.base-m1{background-position:100% 100%}.base-m2{background-position:66.667% 66.667%}.base-m3{background-position:66.667% 33.333%}.base-m4{background-position:66.667% 0%}.base-m5{background-position:66.667% 100%}.base-m6{background-position:33.333% 66.667%}.base-m7{background-position:33.333% 33.333%}.base-m8{background-position:33.333% 0%}.base-skull{background-position:0% 66.667%}.base-cultist{background-position:0% 33.333%}.base-tablet{background-position:0% 100%}.base-elder{background-position:0% 0%}.base-elder_sign{background-position:100% 66.667%}.base-autofail{background-position:100% 100%}.realToken.bless{background-image:url("https://vampirecreations.com/cdn/shop/products/image_eef81949-b70a-4918-8490-068105f3954d_4032x.jpg?v=1599252361");background-size:230% 100%;background-position:0% 50%}.realToken.curse{background-image:url("https://vampirecreations.com/cdn/shop/products/image_eef81949-b70a-4918-8490-068105f3954d_4032x.jpg?v=1599252361");background-size:230% 100%;background-position:100% 50%}.realToken.frost{background-image:url("https://vampirecreations.com/cdn/shop/products/image_5214247b-892b-4411-ab03-e325743f2ed2_1200x1200.jpg?v=1639670421");background-size:145% auto;background-position:35% 50%}.chaosQty{font-size:12px;font-weight:800;color:#5d584f}.chaosBadge{position:absolute;right:5px;top:5px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:#2f2d29;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}.bagSummary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#f5f1e8;border-bottom:1px solid #ded8ce}.bagName{font-weight:850}.bagCount{font-size:12px;color:#716b62}.chaosBagActions{display:flex;gap:7px;flex-wrap:wrap;padding:9px}.chaosDraw{display:grid;gap:14px;text-align:center}.drawToken{width:min(210px,58vw);height:min(210px,58vw);margin:0 auto;display:block}.drawResult{font-size:13px;color:#716b62}.drawResult strong{display:block;font-size:18px;color:#292722;margin-bottom:3px}.history{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding-top:4px}.history .realToken{width:44px;height:44px}@media(max-width:430px){.chaosGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.chaosTile{min-height:72px}.chaosIcon{width:46px;height:46px}.realToken{width:46px;height:46px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div style="display:flex;align-items:center;gap:8px"><div class="title">Table Meeples</div><span class="v">V6.1</span></div>
 <div class="sub">Jeux personnalisés · tables multiples · composants · Chaos Bag</div>
 <div class="bar"><select id="gameSelect"></select><button class="btn" id="menuBtn">Menu</button><button class="btn primary" id="tableBtn">+ Table</button></div>
</header>
<main>
 <section class="panel"><h2>Réserve · toucher l’image pour ajouter</h2><div class="reserve" id="reserve"></div></section>
 <section class="panel"><h2>Tables</h2><div class="zones" id="zones"></div></section>
 <section class="panel"><h2>Compteurs</h2><div id="counters"></div></section><div class="footer">Les composants sont regroupés automatiquement. Touchez une image sur la table pour retirer une seule pièce.</div>
</main>
</div>

<div class="modal" id="modal">
 <div class="sheet">
  <h3 id="modalTitle"></h3>
  <div id="modalBody"></div>
  <div class="row"><button type="button" class="btn" id="cancelBtn">Annuler</button><button type="button" class="btn primary" id="confirmBtn">Valider</button></div>
 </div>
</div>
<input id="importFile" type="file" accept="application/json" hidden>

<script>
const KEY='tableMeeplesV5Data';
const CUR='tableMeeplesV5Current';

const colors=[
 ['Jaune','#e6c229'],['Noir','#282828'],['Rouge','#c9473b'],['Bleu clair','#79b8d1'],['Marron','#8b5e3c'],
 ['Violet','#8e65b5'],['Vert','#5b9b63'],['Blanc','#f4f1e8'],['Orange','#df8a3a'],['Rose','#d889a8'],
 ['Gris','#8d9297'],['Bleu foncé','#3f5f9a'],['Turquoise','#49a9a0'],['Bordeaux','#7f3040'],['Beige','#cdbb99']
];

const icons=[
 ['meeple','Meeple'],['bread','Pain'],['coin','Pièce'],['cube','Cube'],['token','Jeton'],
 ['star','Étoile'],['heart','Cœur'],['gem','Gemme'],['shield','Bouclier'],['crown','Couronne']
];

let games={};
try{games=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){games={}};
let currentId=localStorage.getItem(CUR)||'';
Object.values(games).forEach(normalizeGame);
if(Object.keys(games).length) localStorage.setItem(KEY,JSON.stringify(games));
let modalAction=null, selectedColor=colors[0][1], selectedIcon='meeple';
let chaosBags={};
let currentChaosBagId=localStorage.getItem('tableMeeplesCurrentChaosBag')||'';
try{chaosBags=JSON.parse(localStorage.getItem('tableMeeplesChaosBags')||'{}')||{}}catch(e){chaosBags={}}
const chaosTypes=[
 {id:'p1',label:'+1',file:'p1.svg'},{id:'0',label:'0',file:'0.svg'},{id:'m1',label:'−1',file:'m1.svg'},{id:'m2',label:'−2',file:'m2.svg'},
 {id:'m3',label:'−3',file:'m3.svg'},{id:'m4',label:'−4',file:'m4.svg'},{id:'m5',label:'−5',file:'m5.svg'},{id:'m6',label:'−6',file:'m6.svg'},
 {id:'m7',label:'−7',file:'m7.svg'},{id:'m8',label:'−8',file:'m8.svg'},{id:'skull',label:'Crâne',file:'skull.svg'},
 {id:'cultist',label:'Cultiste',file:'cultist.svg'},{id:'tablet',label:'Tablette',file:'tablet.svg'},{id:'elder',label:'Être ancien',file:'elder.svg'},
 {id:'autofail',label:'Échec automatique',file:'autofail.svg'},{id:'elder_sign',label:'Signe des Anciens',file:'elder_sign.svg'},
 {id:'bless',label:'Bénédiction',file:'bless.svg'},{id:'curse',label:'Malédiction',file:'curse.svg'},{id:'frost',label:'Givre',file:'frost.svg'}
];
const chaosPresets={
 'vide':[],
 'facile':['p1','p1','0','0','0','m1','m1','m1','m2','m2','skull','skull','cultist','tablet','elder','elder_sign'],
 'standard':['p1','0','0','m1','m1','m1','m2','m2','m3','m4','skull','skull','cultist','tablet','elder','elder_sign'],
 'difficile':['0','0','0','m1','m1','m2','m2','m3','m3','m4','m5','skull','skull','cultist','tablet','elder_sign'],
 'expert':['0','m1','m1','m2','m2','m3','m3','m4','m4','m5','m6','m8','skull','skull','cultist','tablet','elder_sign']
};
function persistChaos(){localStorage.setItem('tableMeeplesChaosBags',JSON.stringify(chaosBags));localStorage.setItem('tableMeeplesCurrentChaosBag',currentChaosBagId)}
function currentChaos(){return chaosBags[currentChaosBagId]||null}
function ensureChaosBag(b){if(!b.tokens)b.tokens={};if(!b.history)b.history=[];return b}
function chaosTotal(b){return Object.values(b?.tokens||{}).reduce((n,v)=>n+(Number(v)||0),0)}
function chaosIcon(id,extra=''){let t=chaosTypes.find(x=>x.id===id);if(!t)return '';let cls=(['p1','0','m1','m2','m3','m4','m5','m6','m7','m8','skull','cultist','tablet','elder','elder_sign','autofail'].includes(id))?'base':id;return `<span class="realToken ${cls} base-${id} ${extra}" role="img" aria-label="${esc(t.label)}"></span>`}
function presetTokens(name){let out={};(chaosPresets[name]||[]).forEach(id=>out[id]=(out[id]||0)+1);return out}
Object.values(chaosBags).forEach(ensureChaosBag);if(!currentChaosBagId||!chaosBags[currentChaosBagId]){let ids=Object.keys(chaosBags);currentChaosBagId=ids[0]||'';persistChaos()}


const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function game(){return games[currentId]||null}
function persist(){localStorage.setItem(KEY,JSON.stringify(games));localStorage.setItem(CUR,currentId)}
function normalizeGame(g){
 if(!g.tables && g.placed) g.tables=g.placed;
 if(!g.tables) g.tables=[{id:uid(),name:'Table principale',counts:{}}];
 if(!g.components) g.components=[];
 if(!g.counters) g.counters=[];
 g.tables.forEach(t=>{if(!t.counts)t.counts={}});
 delete g.placed;
 return g;
}

function visual(c, action, extra=''){
 let cls=c.type==='meeple'?'meeple':c.type==='bread'?'bread':c.type==='coin'?'coin':c.type==='cube'?'cube':c.type==='token'?'circle':c.type==='gem'?'gem':c.type==='shield'?'shield':'';
 let content=c.type==='star'?'★':c.type==='heart'?'♥':c.type==='crown'?'♛':'';
 let style=['star','heart','crown'].includes(c.type)?`color:${c.color||'#777'}`:`background:${c.color||'#999'}`;
 return `<span class="iconTap ${extra}" data-action="${action}" data-cid="${esc(c.id)}"><span class="piece"><span class="${cls}" style="${style}">${content}</span></span></span>`;
}

function render(){
 let g=game(), sel=$('gameSelect');
 sel.innerHTML=Object.values(games).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
 sel.value=currentId;
 if(!g){
  $('reserve').innerHTML='<div class="emptyBig" style="grid-column:1/-1">Aucun jeu<br><br>Ouvrez le Menu pour créer votre premier jeu.</div>';
  $('zones').innerHTML='';
  return;
 }
 let r=$('reserve');
 if(!g.components.length) r.innerHTML='<div class="emptyBig" style="grid-column:1/-1">Aucun composant.<br><br>Ouvrez le Menu pour en créer.</div>';
 else r.innerHTML=g.components.map(c=>{
   let used=g.tables.reduce((n,t)=>n+(Number(t.counts[c.id])||0),0);
   let available=Math.max(0,(Number(c.qty)||0)-used);
   return `<div class="card">${visual(c,'add')}<div class="info"><div class="name">${esc(c.name)}</div><div class="qty">Réserve : ${available} / ${Number(c.qty)||0}</div></div></div>`;
 }).join('');

 $('counters').innerHTML=g.counters.length?g.counters.map(c=>`<div class="counter">
   <div class="counterInfo"><div class="counterName">${esc(c.name)}</div></div>
   <div class="counterValue">${Number(c.value)||0}</div>
   <div class="counterBtns"><button data-counter-minus="${esc(c.id)}">−</button><button data-counter-plus="${esc(c.id)}">+</button><button class="reset" data-counter-reset="${esc(c.id)}">Réinitialiser</button></div>
  </div>`).join(''):'<div class="empty">Aucun compteur. Ouvrez le Menu pour en créer.</div>';

 $('zones').innerHTML=g.tables.map((t,i)=>{
   let groups=g.components.map(c=>({c,n:Number(t.counts[c.id])||0})).filter(x=>x.n>0);
   return `<div class="zone" data-zone-id="${esc(t.id)}">
    <div class="zoneHead"><div class="zoneTitle">${esc(t.name)}${i===0?' · principale':''}</div>
    <div class="zoneBtns">${i>0?`<button class="small danger" data-zone-delete="${esc(t.id)}">Supprimer</button>`:''}
    ${groups.length?`<button class="small" data-zone-clear="${esc(t.id)}">Vider</button>`:''}</div></div>
    <div class="groups">${groups.map(x=>`<div class="group"><div class="pieces">${Array.from({length:x.n},()=>visual(x.c,'remove')).join('')}</div><div class="groupCount">${esc(x.c.name)} · ${x.n}</div></div>`).join('')||'<div class="empty">Table vide</div>'}</div>
   </div>`;
 }).join('');
}

function openModal(title,body,fn=null){
 $('modalTitle').textContent=title;$('modalBody').innerHTML=body;modalAction=fn;$('modal').classList.add('show');
}
function closeModal(){$('modal').classList.remove('show');modalAction=null}

function createCounter(){
 openModal('Créer un compteur',
  `<div class="hint">Exemples : Points de victoire, Points de vie, Or, Énergie…</div>
   <input class="field" id="counterName" placeholder="Nom du compteur" autocomplete="off">
   <input class="field" id="counterValue" type="number" value="0" placeholder="Valeur initiale">`,()=>{
    let g=game(); if(!g)return;
    let name=$('counterName').value.trim(); if(!name)return;
    let value=parseInt($('counterValue').value||'0',10); if(!Number.isFinite(value))value=0;
    g.counters.push({id:uid(),name,value}); persist(); closeModal(); render();
  });
}

function manageCounters(){
 let g=game(); if(!g){menu();return}
 let body=g.counters.length?g.counters.map(c=>`<div class="managerRow">
  <div><b>${esc(c.name)}</b><div class="qty">Valeur : ${Number(c.value)||0}</div></div>
  <button class="small danger" data-delete-counter="${esc(c.id)}">Supprimer</button>
 </div>`).join(''):'<p>Aucun compteur.</p>';
 openModal('Gérer les compteurs',body,null);
}

function deleteCounter(cid){
 let g=game(); if(!g)return;
 let c=g.counters.find(x=>x.id===cid); if(!c)return;
 if(!confirm(`Supprimer le compteur « ${c.name} » ?`))return;
 g.counters=g.counters.filter(x=>x.id!==cid); persist(); render(); manageCounters();
}

function changeCounter(cid,delta){
 let g=game(); if(!g)return;
 let c=g.counters.find(x=>x.id===cid); if(!c)return;
 c.value=(Number(c.value)||0)+delta; persist(); render();
}
function resetCounter(cid){
 let g=game(); if(!g)return;
 let c=g.counters.find(x=>x.id===cid); if(!c)return;
 c.value=0; persist(); render();
}

function menu(){
 let items=[
  ['new','Créer un jeu'],
  ['component','Créer un composant'],
  ['drawCard','Tirer une carte'],
  ['chaosBag','Chaos Bag'],
  ['counter','Créer un compteur'],
  ['manageCounters','Gérer les compteurs'],
  ['manage','Gérer les composants'],
  ['save','Sauvegarder le jeu actuel'],
  ['import','Importer un jeu']
 ];
 if(game()) items.push(['delete','Supprimer le jeu actuel']);
 openModal('Menu',`<div class="menuList">${items.map(x=>`<button class="btn ${x[0]==='delete'?'danger':''}" data-menu="${x[0]}">${x[1]}</button>`).join('')}</div>`,null);
}

function newGame(){
 openModal('Créer un jeu','<input class="field" id="gameName" placeholder="Nom du jeu" autocomplete="off">',()=>{
  let n=$('gameName').value.trim();if(!n)return;
  currentId=uid();games[currentId]={id:currentId,name:n,components:[],counters:[],tables:[{id:uid(),name:'Table principale',counts:{}}]};
  persist();closeModal();render();
 });
}

function component(){
 selectedIcon='meeple';selectedColor=colors[0][1];
 let choices=icons.map(x=>`<button type="button" class="choice ${x[0]==='meeple'?'selected':''}" data-icon="${x[0]}">${x[1]}</button>`).join('');
 let pal=colors.map(x=>`<button type="button" class="sw ${x[1]===selectedColor?'selected':''}" title="${x[0]}" style="background:${x[1]}" data-color="${x[1]}"></button>`).join('');
 openModal('Créer un composant',
  `<div class="hint">Type de composant</div><div class="grid">${choices}</div>
   <div class="hint">Couleur · 15 couleurs disponibles</div><div class="palette">${pal}</div>
   <input class="field" id="compName" placeholder="Nom du composant">
   <input class="field" id="compQty" type="number" min="1" value="10" placeholder="Quantité totale">`,()=>{
    let g=game();if(!g)return;
    let name=$('compName').value.trim();
    let qty=Math.max(1,parseInt($('compQty').value||'1',10));
    if(!name){
      let label=icons.find(x=>x[0]===selectedIcon)[1];
      if(selectedIcon==='meeple') label='Meeple '+colors.find(x=>x[1]===selectedColor)[0].toLowerCase();
      name=label;
    }
    g.components.push({id:uid(),name,type:selectedIcon,color:selectedColor,qty});
    persist();closeModal();render();
  });
 document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{
   selectedIcon=b.dataset.icon;
   document.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('selected',x===b));
   if(selectedIcon==='coin' && !$('compName').value) $('compName').value='Pièce';
   if(selectedIcon!=='meeple' && $('compName').value.startsWith('Meeple ')) $('compName').value='';
 });
 document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{
   selectedColor=b.dataset.color;
   document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b));
   if(selectedIcon==='meeple') $('compName').value='Meeple '+colors.find(x=>x[1]===selectedColor)[0].toLowerCase();
 });
}

function manageComponents(){
 let g=game();if(!g){menu();return}
 let body=g.components.length?g.components.map(c=>`
  <div class="managerRow"><div><b>${esc(c.name)}</b><div class="qty">${esc(icons.find(x=>x[0]===c.type)?.[1]||c.type)} · ${c.qty}</div></div>
  <div style="display:flex;gap:5px"><button class="small" data-edit-comp="${esc(c.id)}">Modifier</button><button class="small danger" data-delete-comp="${esc(c.id)}">Supprimer</button></div></div>`).join(''):'<p>Aucun composant.</p>';
 openModal('Gérer les composants',body,null);
}

function editComponent(cid){
 let g=game(),c=g?.components.find(x=>x.id===cid);if(!c)return;
 selectedIcon=c.type;selectedColor=c.color||colors[0][1];
 let choices=icons.map(x=>`<button type="button" class="choice ${x[0]===selectedIcon?'selected':''}" data-icon="${x[0]}">${x[1]}</button>`).join('');
 let pal=colors.map(x=>`<button type="button" class="sw ${x[1]===selectedColor?'selected':''}" title="${x[0]}" style="background:${x[1]}" data-color="${x[1]}"></button>`).join('');
 openModal('Modifier le composant',
  `<div class="hint">Type</div><div class="grid">${choices}</div><div class="hint">Couleur</div><div class="palette">${pal}</div>
   <input class="field" id="compName" value="${esc(c.name)}"><input class="field" id="compQty" type="number" min="1" value="${Number(c.qty)||1}">`,()=>{
    c.type=selectedIcon;c.color=selectedColor;c.name=$('compName').value.trim()||c.name;c.qty=Math.max(1,parseInt($('compQty').value||'1',10));
    persist();closeModal();render();
  });
 document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{selectedIcon=b.dataset.icon;document.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('selected',x===b))});
 document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selectedColor=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('selected',x===b))});
}

function deleteComponent(cid){
 let g=game(),c=g?.components.find(x=>x.id===cid);if(!c)return;
 if(!confirm(`Supprimer « ${c.name} » et toutes les pièces de ce composant ?`))return;
 g.components=g.components.filter(x=>x.id!==cid);
 g.tables.forEach(t=>delete t.counts[cid]);
 persist();render();manageComponents();
}

function addTable(){
 let g=game();if(!g)return;
 openModal('Créer une table','<input class="field" id="tableName" placeholder="Nom de la table" autocomplete="off">',()=>{
  let n=$('tableName').value.trim();if(!n)return;
  g.tables.push({id:uid(),name:n,counts:{}});persist();closeModal();render();
 });
}

function deleteTable(tid){
 let g=game(),i=g.tables.findIndex(t=>t.id===tid);if(i<=0)return;
 if(!confirm('Supprimer cette table ? Les composants placés dessus retournent dans la réserve.'))return;
 g.tables.splice(i,1);persist();render();
}

function clearTable(tid){
 let g=game(),t=g.tables.find(x=>x.id===tid);if(!t)return;
 if(!confirm('Vider cette table et remettre tous ses composants dans la réserve ?'))return;
 t.counts={};persist();render();
}

function addToTable(cid,tid){
 let g=game(),c=g?.components.find(x=>x.id===cid),t=g?.tables.find(x=>x.id===tid);if(!c||!t)return;
 let used=g.tables.reduce((n,x)=>n+(Number(x.counts[cid])||0),0);
 if(used>=Number(c.qty))return;
 t.counts[cid]=(Number(t.counts[cid])||0)+1;persist();render();
}

function chooseTable(cid){
 let g=game();if(!g)return;
 if(g.tables.length===1){addToTable(cid,g.tables[0].id);return}
 openModal('Sur quelle table ajouter ?',`<div class="menuList">${g.tables.map(t=>`<button type="button" class="btn" data-pick-table="${esc(t.id)}">${esc(t.name)}</button>`).join('')}</div>`,null);
}

function removeOne(tid,cid){
 let g=game(),t=g?.tables.find(x=>x.id===tid);if(!t||!t.counts[cid])return;
 t.counts[cid]--;if(t.counts[cid]<=0)delete t.counts[cid];persist();render();
}

function createChaosBag(){openModal('Créer un Chaos Bag',`<input class="field" id="chaosBagName" placeholder="Nom du sac" autocomplete="off"><div class="hint">Choisissez un modèle de départ. Le contenu restera entièrement modifiable.</div><select class="field" id="chaosPreset"><option value="vide">Sac vide</option><option value="facile">Facile</option><option value="standard" selected>Standard</option><option value="difficile">Difficile</option><option value="expert">Expert</option></select>`,()=>{let name=$('chaosBagName').value.trim();if(!name)return;let id=uid(),preset=$('chaosPreset').value;chaosBags[id]={id,name,tokens:presetTokens(preset),history:[]};currentChaosBagId=id;persistChaos();closeModal();manageChaosBags()})}
function manageChaosBags(){let bags=Object.values(chaosBags);let body=`<div class="hint">Sac actif : choisissez un sac puis modifiez son contenu.</div>`+bags.map(b=>`<div class="managerRow"><div style="min-width:0"><b>${esc(b.name)}</b><div class="qty">${chaosTotal(b)} jeton${chaosTotal(b)>1?'s':''}${b.id===currentChaosBagId?' · actif':''}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button type="button" class="small ${b.id===currentChaosBagId?'primary':''}" data-chaos-open="${esc(b.id)}">${b.id===currentChaosBagId?'Modifier':'Choisir'}</button><button type="button" class="small danger" data-chaos-delete="${esc(b.id)}">Supprimer</button></div></div>`).join('');if(!bags.length)body+='<p>Aucun Chaos Bag. Créez-en un.</p>';body+=`<div class="row"><button type="button" class="btn primary" id="newChaosBagBtn">+ Créer un sac</button></div>`;openModal('Chaos Bags',body,null)}
function editChaosBag(id=currentChaosBagId){let b=chaosBags[id];if(!b)return;currentChaosBagId=id;persistChaos();let total=chaosTotal(b);let body=`<div class="bagSummary"><div><div class="bagName">${esc(b.name)}</div><div class="bagCount">${total} jeton${total>1?'s':''}</div></div><button type="button" class="small" id="renameChaosBtn">Renommer</button></div><div class="hint">Touchez un jeton pour ajouter un exemplaire. Les jetons présents sont regroupés avec leur quantité.</div><div class="chaosGrid">${chaosTypes.map(t=>{let n=Number(b.tokens[t.id])||0;return `<button type="button" class="chaosTile" data-chaos-add="${t.id}" aria-label="Ajouter ${esc(t.label)}">${chaosIcon(t.id)}${n?`<span class="chaosBadge">${n}</span>`:''}<div class="chaosQty">${n?'× '+n:'+'}</div></button>`}).join('')}</div><div class="panel" style="margin:0 9px 9px"><h2>Jetons dans le sac · toucher pour retirer 1</h2><div class="chaosGrid">${chaosTypes.filter(t=>(Number(b.tokens[t.id])||0)>0).map(t=>`<button type="button" class="chaosTile" data-chaos-remove="${t.id}" aria-label="Retirer un ${esc(t.label)}">${chaosIcon(t.id)}<span class="chaosBadge">${Number(b.tokens[t.id])||0}</span></button>`).join('')||'<div class="empty" style="grid-column:1/-1">Sac vide</div>'}</div></div><div class="chaosBagActions"><button type="button" class="btn primary" id="drawChaosBtn">Tirer un jeton</button><button type="button" class="btn" id="chaosBackBtn">Retour</button></div>`;openModal('Construire le Chaos Bag',body,null)}
function renameChaosBag(){let b=currentChaos();if(!b)return;openModal('Renommer le Chaos Bag',`<input class="field" id="chaosRename" value="${esc(b.name)}" autocomplete="off">`,()=>{let n=$('chaosRename').value.trim();if(!n)return;b.name=n;persistChaos();editChaosBag()})}
function drawChaosToken(){let b=currentChaos();if(!b||chaosTotal(b)<=0){alert('Le Chaos Bag est vide.');return}let pool=[];Object.entries(b.tokens).forEach(([id,n])=>{for(let i=0;i<(Number(n)||0);i++)pool.push(id)});let id=pool[Math.floor(Math.random()*pool.length)];let t=chaosTypes.find(x=>x.id===id);b.history=[id,...(b.history||[])].slice(0,5);persistChaos();let hist=(b.history||[]).map(x=>chaosIcon(x)).join('');openModal('Tirage du Chaos Bag',`<div class="chaosDraw">${chaosIcon(id,'drawToken')}<div class="drawResult"><strong>${esc(t?.label||'Jeton')}</strong>${chaosTotal(b)} jetons dans le sac</div><div class="hint">Le jeton revient immédiatement dans le sac.</div><div class="history" aria-label="Derniers tirages">${hist}</div><button type="button" class="btn primary" id="drawChaosAgainBtn">Tirer à nouveau</button><button type="button" class="btn" id="editChaosAfterDrawBtn">Modifier le sac</button></div>`,null)}
function changeChaos(id,delta){let b=currentChaos();if(!b)return;let n=(Number(b.tokens[id])||0)+delta;if(n<=0)delete b.tokens[id];else b.tokens[id]=n;persistChaos();editChaosBag()}

function exportGame(){
 let g=game();if(!g)return;
 let blob=new Blob([JSON.stringify(g,null,2)],{type:'application/json'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=g.name.replace(/[^a-z0-9àâçéèêëîïôûùüÿæœ_-]+/gi,'_')+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

function importGame(){$('importFile').click()}
$('importFile').onchange=e=>{
 let f=e.target.files[0];if(!f)return;
 let rd=new FileReader();rd.onload=()=>{
  try{let g=normalizeGame(JSON.parse(rd.result));if(!g.name||!g.components)throw 0;
   g.id=uid();games[g.id]=g;currentId=g.id;persist();render();
  }catch(_){alert('Fichier de jeu invalide.')}
  e.target.value='';
 };rd.readAsText(f);
};

$('gameSelect').onchange=e=>{currentId=e.target.value;persist();render()};
$('menuBtn').addEventListener('click',e=>{e.preventDefault();menu()});
$('tableBtn').addEventListener('click',e=>{e.preventDefault();addTable()});
$('cancelBtn').addEventListener('click',e=>{e.preventDefault();closeModal()});
$('confirmBtn').addEventListener('click',e=>{
  e.preventDefault();
  const action=modalAction;
  if(typeof action==='function') action();
});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

$('reserve').onclick=e=>{
 let x=e.target.closest('[data-action="add"]');if(x)chooseTable(x.dataset.cid);
};

$('counters').onclick=e=>{
 let x=e.target.closest('[data-counter-plus]'); if(x){changeCounter(x.dataset.counterPlus,1);return}
 x=e.target.closest('[data-counter-minus]'); if(x){changeCounter(x.dataset.counterMinus,-1);return}
 x=e.target.closest('[data-counter-reset]'); if(x){resetCounter(x.dataset.counterReset);return}
};

$('zones').onclick=e=>{
 let rem=e.target.closest('[data-action="remove"]');
 if(rem){
   let zone=e.target.closest('.zone');removeOne(zone.dataset.zoneId,rem.dataset.cid);return;
 }
 let del=e.target.closest('[data-zone-delete]');if(del){deleteTable(del.dataset.zoneDelete);return}
 let clr=e.target.closest('[data-zone-clear]');if(clr){clearTable(clr.dataset.zoneClear);return}
};

$('modalBody').onclick=e=>{
 let m=e.target.closest('[data-menu]');
 if(m){
   let a=m.dataset.menu;
   if(a==='new')newGame();
   else if(a==='component')component();
   else if(a==='drawCard')drawCard();
   else if(a==='chaosBag')manageChaosBags();
   else if(a==='counter')createCounter();
   else if(a==='manage')manageComponents();
   else if(a==='manageCounters')manageCounters();
   else if(a==='save'){exportGame();closeModal()}
   else if(a==='import'){importGame();closeModal()}
   else if(a==='delete'){
     let g=game();
     if(g&&confirm(`Supprimer définitivement le jeu « ${g.name} » ?`)){delete games[currentId];currentId=Object.keys(games)[0]||'';persist();closeModal();render()}
   }
   return;
 }
 let p=e.target.closest('[data-pick-table]');
 if(p){addToTable($('modalTitle').dataset.cid||'',p.dataset.pickTable);return}
 let dcounter=e.target.closest('[data-delete-counter]');if(dcounter){deleteCounter(dcounter.dataset.deleteCounter);return}
 let ec=e.target.closest('[data-edit-comp]');if(ec){editComponent(ec.dataset.editComp);return}
 let dc=e.target.closest('[data-delete-comp]');if(dc){deleteComponent(dc.dataset.deleteComp);return}
 let ca=e.target.closest('[data-chaos-open]');if(ca){editChaosBag(ca.dataset.chaosOpen);return}
 let cd=e.target.closest('[data-chaos-delete]');if(cd){let bag=chaosBags[cd.dataset.chaosDelete];if(bag&&confirm(`Supprimer le Chaos Bag « ${bag.name} » ?`)){delete chaosBags[bag.id];if(currentChaosBagId===bag.id)currentChaosBagId=Object.keys(chaosBags)[0]||'';persistChaos();manageChaosBags()}return}
 let add=e.target.closest('[data-chaos-add]');if(add){changeChaos(add.dataset.chaosAdd,1);return}
 let rem=e.target.closest('[data-chaos-remove]');if(rem){changeChaos(rem.dataset.chaosRemove,-1);return}
 if(e.target.id==='newChaosBagBtn'){createChaosBag();return}
 if(e.target.id==='renameChaosBtn'){renameChaosBag();return}
 if(e.target.id==='drawChaosBtn'||e.target.id==='drawChaosAgainBtn'){drawChaosToken();return}
 if(e.target.id==='editChaosAfterDrawBtn'){editChaosBag();return}
 if(e.target.id==='chaosBackBtn'){manageChaosBags();return}
};

// Keep the component id for the table-selection modal without relying on global DOM hacks.
const originalChooseTable=chooseTable;
chooseTable=function(cid){
 let g=game();if(!g)return;
 if(g.tables.length===1){addToTable(cid,g.tables[0].id);return}
 openModal('Sur quelle table ajouter ?',`<div class="menuList">${g.tables.map(t=>`<button type="button" class="btn" data-pick-table="${esc(t.id)}">${esc(t.name)}</button>`).join('')}</div>`,null);
 $('modalTitle').dataset.cid=cid;
};
render();
</script>
</body>
</html>
