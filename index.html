<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Table Meeples">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Table Meeples</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;color:#1c1c1e;background:#f2f2f7}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{min-height:44px;border:0;border-radius:12px;background:#e5e5ea;color:#111;padding:0 13px}
header{padding:max(14px,env(safe-area-inset-top)) 16px 10px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:700;font-size:20px}.sub{font-size:13px;color:#6e6e73;margin-top:2px}
main{padding:12px 12px max(24px,env(safe-area-inset-bottom));max-width:900px;margin:auto}
.panel{background:#fff;border-radius:16px;margin-bottom:12px;padding:12px;box-shadow:0 1px 2px #0000000d}.section-title{font-weight:700;margin-bottom:10px}
.reserve{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}.res{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px;border-radius:14px;background:#f2f2f7}.res:disabled{opacity:.35}.name{font-size:12px;text-align:center;line-height:1.1}.qty{font-size:12px;color:#6e6e73;font-variant-numeric:tabular-nums}
.table{min-height:300px;background:#e8e8ed;border-radius:14px;padding:12px}.groups{display:flex;flex-direction:column;gap:12px}.group{background:#fff;border-radius:14px;padding:10px}.ghead{display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:14px;margin-bottom:8px}.pieces{display:flex;flex-wrap:wrap;gap:7px}
.piece{width:46px;height:46px;display:flex;align-items:center;justify-content:center;flex:none;filter:drop-shadow(0 2px 2px #0002);touch-action:manipulation}
.meeple{clip-path:polygon(30% 92%,34% 57%,28% 45%,26% 36%,31% 25%,40% 22%,44% 14%,50% 10%,56% 14%,60% 22%,69% 25%,74% 36%,72% 45%,66% 57%,70% 92%);border-radius:8px}
.yellow{background:#d5ad22}.black{background:#252525}.red{background:#a9403d}.blue{background:#74abc8}.brown{background:#805337}
.bread{width:54px;height:32px;background:#d98225;border-radius:45% 55% 50% 48%;margin:7px 0}
.coin{border-radius:50%;background:linear-gradient(145deg,#fff,#aeb3b8);border:2px solid #777;color:#777;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;color:#8e8e93;padding:45px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left)) max(22px,env(safe-area-inset-bottom));max-height:85%;overflow:auto}
.field{margin:10px 0}.field label{display:block;font-size:13px;color:#6e6e73;margin-bottom:5px}.field input,.field select{width:100%;height:46px;border:1px solid #c7c7cc;border-radius:10px;padding:0 10px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}.danger{background:#ff3b30;color:#fff}.primary{background:#007aff;color:#fff}
@media(min-width:700px){.reserve{grid-template-columns:repeat(7,1fr)}.modal{align-items:center;justify-content:center}.sheet{max-width:480px;border-radius:20px}}
</style></head>
<body>
<header><div class="head"><div><div class="title">Table Meeples</div><div class="sub" id="gameName"></div></div><select id="gameSelect"></select></div></header>
<main>
<section class="panel"><div class="section-title">Réserve</div><div id="reserve" class="reserve"></div></section>
<section class="panel"><div class="section-title">Table</div><div id="table" class="table"></div></section>
<div class="actions"><button id="newGame">+ Nouveau jeu</button><button id="addComponent">+ Composant</button><button id="reset">Réinitialiser la table</button></div>
</main>
<div id="modal" class="modal"><div class="sheet"><div id="modalContent"></div></div></div>
<script>
const KEY="tableMeeples.pwa.v1";
const defaultGame={name:"Paladins du Royaume de l’Ouest",components:[
{name:"Meeple jaune",qty:10,type:"yellow"},{name:"Meeple noir",qty:10,type:"black"},{name:"Meeple rouge",qty:10,type:"red"},
{name:"Meeple bleu clair",qty:10,type:"blue"},{name:"Meeple brun",qty:10,type:"brown"},{name:"Pain",qty:10,type:"bread"},{name:"Monnaie argentée",qty:20,type:"coin"}]};
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{games:[defaultGame],current:0,table:[]};
let table=data.table||[];
function save(){data.table=table;localStorage.setItem(KEY,JSON.stringify(data))}
function game(){return data.games[data.current]}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function icon(c){return `<span class="piece ${c.type==='bread'?'bread':c.type==='coin'?'coin':'meeple '+c.type}">${c.type==='coin'?'✦':''}</span>`}
function render(){
 document.getElementById("gameName").textContent=game().name;
 const gs=document.getElementById("gameSelect");gs.innerHTML=data.games.map((g,i)=>`<option value="${i}">${esc(g.name)}</option>`).join("");gs.value=data.current;
 const r=document.getElementById("reserve");r.innerHTML="";
 game().components.forEach((c,i)=>{const b=document.createElement("button");b.className="res";b.disabled=c.qty<=0;b.innerHTML=icon(c)+`<span class="name">${esc(c.name)}</span><span class="qty">${c.qty}</span>`;b.onclick=()=>take(i);r.appendChild(b)});
 const t=document.getElementById("table");t.innerHTML="";const groups=[];
 game().components.forEach((c,i)=>{const ids=table.filter(x=>x.component===i);if(ids.length)groups.push({c,i,ids})});
 if(!groups.length){t.innerHTML='<div class="empty">La table est vide.<br>Prends des composants dans la réserve.</div>';return}
 const wrap=document.createElement("div");wrap.className="groups";
 groups.forEach(g=>{const box=document.createElement("div");box.className="group";box.innerHTML=`<div class="ghead"><span>${esc(g.c.name)}</span><span>${g.ids.length}</span></div>`;const line=document.createElement("div");line.className="pieces";g.ids.forEach(item=>{const b=document.createElement("button");b.className="piece";b.innerHTML=icon(g.c);b.title="Remettre dans la réserve";b.onclick=()=>back(item.id);line.appendChild(b)});box.appendChild(line);wrap.appendChild(box)});t.appendChild(wrap)
}
function take(i){const c=game().components[i];if(c.qty<=0)return;c.qty--;table.push({id:crypto.randomUUID(),component:i});save();render()}
function back(id){const x=table.find(x=>x.id===id);if(!x)return;game().components[x.component].qty++;table=table.filter(y=>y.id!==id);save();render()}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function open(content){document.getElementById("modalContent").innerHTML=content;document.getElementById("modal").classList.add("show")}
document.getElementById("gameSelect").onchange=e=>{data.current=+e.target.value;table=[];save();render()};
document.getElementById("reset").onclick=()=>{if(confirm("Remettre tous les composants dans la réserve ?")){game().components.forEach(c=>{c.qty+=table.filter(x=>x.component===game().components.indexOf(c)).length});table=[];save();render()}};
document.getElementById("newGame").onclick=()=>{open(`<h2>Nouveau jeu</h2><div class="field"><label>Nom du jeu</label><input id="gn" placeholder="Ex. Terraforming Mars"></div><div class="row"><button onclick="closeModal()">Annuler</button><button class="primary" onclick="createGame()">Créer</button></div>`)};
window.createGame=()=>{const n=document.getElementById("gn").value.trim();if(!n)return;data.games.push({name:n,components:[]});data.current=data.games.length-1;table=[];save();closeModal();render()};
document.getElementById("addComponent").onclick=()=>{open(`<h2>Nouveau composant</h2><div class="field"><label>Nom</label><input id="cn" placeholder="Ex. Meeple violet"></div><div class="field"><label>Quantité</label><input id="cq" type="number" min="0" max="999" value="10"></div><div class="field"><label>Aspect</label><select id="ct"><option value="yellow">Jaune</option><option value="black">Noir</option><option value="red">Rouge</option><option value="blue">Bleu clair</option><option value="brown">Brun</option><option value="bread">Pain</option><option value="coin">Monnaie argentée</option></select></div><div class="row"><button onclick="closeModal()">Annuler</button><button class="primary" onclick="createComponent()">Ajouter</button></div>`)};
window.createComponent=()=>{const n=document.getElementById("cn").value.trim();const q=Math.max(0,Math.min(999,+document.getElementById("cq").value||0));if(!n)return;game().components.push({name:n,qty:q,type:document.getElementById("ct").value});save();closeModal();render()};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();
</script></body></html>
